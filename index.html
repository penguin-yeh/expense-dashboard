*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}

#lock{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#f6f4ef;padding:20px;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}

button:disabled{opacity:.6}
.err{color:#c0392b;font-size:.88rem;min-height:1.4em;margin-top:10px}

<script>
(function(){
var B=JSON.parse(document.getElementById('blob').textContent),C=crypto.subtle,LS='ledger-dash-key';
function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function b64(a){var s='';new Uint8Array(a).forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)}
function dec(key,o){return C.decrypt({name:'AES-GCM',iv:u8(o.iv)},key,u8(o.ct))}
function aes(raw){return C.importKey('raw',raw,'AES-GCM',false,['decrypt'])}
function derive(pw,salt){return C.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
 return C.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:u8(salt),iterations:B.it},k,256)})}
function runScripts(){
 var list=Array.prototype.slice.call(document.querySelectorAll('script'));
 for(var i=0;i<list.length;i++){
  var old=list[i],typ=(old.getAttribute('type')||'').toLowerCase();
  if(typ&&typ!=='text/javascript'&&typ!=='application/javascript')continue;
  var s=document.createElement('script');
  for(var j=0;j<old.attributes.length;j++)s.setAttribute(old.attributes[j].name,old.attributes[j].value);
  s.textContent=old.textContent;
  old.parentNode.replaceChild(s,old);
 }
}
function replacePage(h){
 var doc=new DOMParser().parseFromString(h,'text/html');
 document.documentElement.replaceWith(doc.documentElement);
 runScripts();
}
function open_(cek){return aes(cek).then(function(k){return dec(k,B.c)}).then(function(buf){
 replacePage(new TextDecoder().decode(buf))})}
function viaRemember(raw){return aes(raw).then(function(k){return dec(k,B.wr)}).then(open_)}
function busy(on,msg){
 var go=document.getElementById('go'),err=document.getElementById('err');
 if(!go)return;
 go.disabled=!!on;go.textContent=on?(msg||'解鎖中…'):'打開';
 if(err&&on)err.textContent='';
}
var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err');
var saved=null;try{saved=localStorage.getItem(LS)}catch(_){}
if(saved){
 busy(true,'解鎖中…');
 Promise.resolve().then(function(){return viaRemember(u8(saved))}).catch(function(){
  try{localStorage.removeItem(LS)}catch(_){}
  busy(false);if(err)err.textContent='請重新輸入密碼';
 });
}
f.addEventListener('submit',function(e){e.preventDefault();if(!pw.value)return;
 busy(true);var p=pw.value,rm=document.getElementById('rm').checked;
 derive(p,B.s).then(aes).then(function(k){return dec(k,B.wp)}).then(function(cek){
  if(!rm)return open_(cek);
  return derive(p,B.rs).then(function(r){try{localStorage.setItem(LS,b64(r))}catch(_){}return open_(cek)})
 }).catch(function(){busy(false);err.textContent='密碼不對';pw.select()})});
})();
</script></body></html>
