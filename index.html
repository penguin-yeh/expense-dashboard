<script>
(function(){
var B=JSON.parse(document.getElementById('blob').textContent),C=crypto.subtle,LS='ledger-dash-key';
function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function b64(a){var s='';new Uint8Array(a).forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)}
function dec(key,o){return C.decrypt({name:'AES-GCM',iv:u8(o.iv)},key,u8(o.ct))}
function aes(raw){return C.importKey('raw',raw,'AES-GCM',false,['decrypt'])}
function derive(pw,salt){return C.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
 return C.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:u8(salt),iterations:B.it},k,256)})}
function open_(cek){return aes(cek).then(function(k){return dec(k,B.c)}).then(function(buf){
 var h=new TextDecoder().decode(buf);document.open();document.write(h);document.close()})}
function viaRemember(raw){return aes(raw).then(function(k){return dec(k,B.wr)}).then(open_)}
var saved=null;try{saved=localStorage.getItem(LS)}catch(_){}
if(saved){viaRemember(u8(saved)).catch(function(){try{localStorage.removeItem(LS)}catch(_){}})}
var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',function(e){e.preventDefault();if(!pw.value)return;
 go.disabled=true;go.textContent='解鎖中…';err.textContent='';var p=pw.value,rm=document.getElementById('rm').checked;
 derive(p,B.s).then(aes).then(function(k){return dec(k,B.wp)}).then(function(cek){
  if(!rm)return open_(cek);
  return derive(p,B.rs).then(function(r){try{localStorage.setItem(LS,b64(r))}catch(_){}return open_(cek)})
 }).catch(function(){err.textContent='密碼不對';go.disabled=false;go.textContent='打開';pw.select()})});
})();
</script></body></html>
